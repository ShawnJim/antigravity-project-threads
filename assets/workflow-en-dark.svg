    <marker id="arrowBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 L2.5 5 z" fill="#60A5FA"/></marker>
